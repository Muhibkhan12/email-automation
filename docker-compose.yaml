
services:

  # FRONTEND
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # BACKEND
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # CELERY WORKER
  celery_worker:
    build: ./backend
    command: celery -A workers.celery_app worker -l info -Q email_sender_queue,extract_emails_queue --pool=solo
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  # CELERY BEAT
  celery_beat:
    build: ./backend
    command: celery -A workers.celery_app beat -l info
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  # REDIS
  redis:
    image: redis:7
    restart: unless-stopped

  # MYSQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "outwerk@1214"
      MYSQL_DATABASE: email_automation
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data: